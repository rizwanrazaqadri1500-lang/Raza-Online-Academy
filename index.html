    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raza Online Islamic Academy - Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        h2 {
            font-size: 18px;
            color: #0f172a;
            margin-bottom: 6px;
        }
        p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 13px;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
        }
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Class Date & Time Settings</h2>
        <p>Set the schedule details for the student class below.</p>

        <div class="form-group">
            <label for="admin-class-date">Select Date:</label>
            <input type="date" id="admin-class-date">
        </div>

        <div class="form-group">
            <label for="admin-start-time">Class Start Time:</label>
            <input type="text" id="admin-start-time" value="04:00 PM">
        </div>

        <div class="form-group">
            <label for="admin-end-time">Class End Time:</label>
            <input type="text" id="admin-end-time" value="05:00 PM">
        </div>

        <button class="btn" onclick="alert('Class schedule saved successfully!')">Save Schedule</button>
    </div>

</body>
</html>
