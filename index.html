    <!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raza Online Islamic Academy - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex font-sans antialiased text-slate-800 overflow-hidden">

    <!-- MAIN WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Top Header -->
        <header class="bg-slate-900 text-white shadow-md h-14 flex items-center justify-between px-6 z-10">
            <div class="flex items-center space-x-3">
                <div>
                    <h2 class="font-bold text-sm leading-tight">Raza Online Islamic Academy</h2>
                    <span class="text-[10px] text-slate-400">Admin Attendance & Schedule Management</span>
                </div>
            </div>
        </header>

        <!-- Scrollable Content Area -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-6">
            
            <div class="max-w-4xl mx-auto space-y-6">
                
                <!-- Daily Sabaq & Attendance Table Box -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center space-x-3">
                        <i class="fa-solid fa-calendar-days text-amber-500 text-base"></i>
                        <h3 class="text-sm font-bold text-slate-900">Daily Sabaq & Attendance</h3>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-600 uppercase tracking-wider bg-slate-50/50">
                                    <th class="p-3.5 w-1/3 border-r border-slate-200">Student Detail</th>
                                    <th class="p-3.5">Attendance & Sabaq Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <!-- Student Detail Column -->
                                    <td class="p-3.5 border-r border-slate-200 align-top bg-slate-50/30">
                                        <div class="font-bold text-slate-900 text-sm">Abdul Rehman</div>
                                        <div class="text-[11px] text-slate-500 mt-0.5">S/O: Ali</div>
                                    </td>

                                    <!-- Attendance & Schedule Details Column -->
                                    <td class="p-3.5 space-y-3 align-top">
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div>
                                                <label class="block text-[11px] font-semibold text-slate-700 mb-1">Attendance:</label>
                                                <select id="admin-att-status" onchange="toggleTimeFields()" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none">
                                                    <option value="Present">Present</option>
                                                    <option value="Absent">Absent</option>
                                                    <option value="Leave">Leave</option>
                                                    <option value="Weekend - Sunday (Off)">Weekend - Sunday (Off)</option>
                                                    <option value="Other Off / Skipped">Other Off / Skipped</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-semibold text-slate-700 mb-1">Fee Status:</label>
                                                <select id="admin-fee-status" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-blue-600 outline-none">
                                                    <option>Paid</option>
                                                    <option>Pending</option>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- DYNAMIC DATE & TIME SETTINGS BOX (Appears ONLY when Present) -->
                                        <div id="datetime-options-box" class="p-3 bg-blue-50/80 border border-blue-200 rounded-xl space-y-3">
                                            <div class="text-[11px] font-bold text-blue-900 flex items-center space-x-1.5">
                                                <i class="fa-solid fa-clock"></i>
                                                <span>Class Date & Time Settings:</span>
                                            </div>

                                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                <!-- Select Date -->
                                                <div>
                                                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Select Date:</label>
                                                    <input type="date" id="admin-class-date" class="w-full bg-white border border-blue-300 px-3 py-2 rounded-lg text-xs font-bold text-blue-900 shadow-inner outline-none focus:ring-2 focus:ring-blue-600">
                                                </div>

                                                <!-- Class Start Time -->
                                                <div>
                                                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Class Start Time:</label>
                                                    <input type="text" id="admin-start-time" value="04:00 PM" class="w-full bg-white border border-blue-300 px-3 py-2 rounded-lg text-xs font-bold text-blue-900 shadow-inner outline-none focus:ring-2 focus:ring-blue-600">
                                                </div>

                                                <!-- Class End Time -->
                                                <div>
                                                    <label class="block text-[10px] font-semibold text-slate-600 mb-1">Class End Time:</label>
                                                    <input type="text" id="admin-end-time" value="05:00 PM" class="w-full bg-white border border-blue-300 px-3 py-2 rounded-lg text-xs font-bold text-emerald-800 shadow-inner outline-none focus:ring-2 focus:ring-blue-600">
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <label class="block text-[11px] font-semibold text-slate-700 mb-1">Sabaq Details:</label>
                                            <input type="text" id="admin-sabaq-text" placeholder="Aaj ka sabaq" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-600">
                                        </div>

                                        <div class="flex justify-end pt-1">
                                            <button onclick="alert('Daily record updated successfully!')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                                                Update Daily Record
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripting for Dynamic Show/Hide -->
    <script>
        function toggleTimeFields() {
            let attStatus = document.getElementById('admin-att-status').value;
            let datetimeBox = document.getElementById('datetime-options-box');

            if (attStatus === "Present") {
                datetimeBox.style.display = "block"; // Show when Present
            } else {
                datetimeBox.style.display = "none";  // Hide for Absent, Leave, Off, etc.
            }
        }

        // Run on load
        window.onload = function() {
            toggleTimeFields();
        };
    </script>
</body>
</html>
