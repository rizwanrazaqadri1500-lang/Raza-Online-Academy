  <!-- Custom Add Month Modal -->
<div id="customMonthModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:25px; border-radius:12px; width:320px; box-shadow:0 4px 15px rgba(0,0,0,0.2); text-align:center; font-family:sans-serif;">
        <h3 style="margin-top:0; color:#333; font-size:18px;">Add New Month & Year</h3>
        <p style="color:#666; font-size:14px; margin-bottom:15px;">(e.g., July 2027)</p>
        <input type="text" id="customMonthInput" placeholder="Enter month & year..." style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-bottom:15px; outline:none;">
        <div style="display:flex; justify-content:space-between; gap:10px;">
            <button onclick="closeCustomMonthModal()" style="flex:1; background:#ccc; color:#333; border:none; padding:10px; border-radius:6px; cursor:pointer; font-weight:bold;">Cancel</button>
            <button onclick="saveCustomMonth()" style="flex:1; background:#0f766e; color:white; border:none; padding:10px; border-radius:6px; cursor:pointer; font-weight:bold;">Add Month</button>
        </div>
    </div>
</div>
